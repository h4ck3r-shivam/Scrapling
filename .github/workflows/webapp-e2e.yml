name: webapp-e2e

on:
  push:
    branches:
      - main
    paths:
      - 'webapp/**'
      - '.github/workflows/webapp-e2e.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'webapp/**'
      - '.github/workflows/webapp-e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webapp/web

    env:
      SCC_DB_PATH: /tmp/scc-e2e.db
      SCC_ADMIN_PASSWORD: e2e-admin-pw
      SCC_ADMIN_EMAIL: admin@example.com
      SCC_CORS_ORIGINS: http://127.0.0.1:5173
      SCC_SECRET_KEY: ci-test-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          python-version: 3.12
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            webapp/pyproject.toml

      - name: Install backend dependencies
        run: uv sync --all-extras

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14