# Chaan-Been — Docker Compose (Ubuntu VM + Cloudflare Tunnel)
#
# Deploy:
#   1. Copy webapp/api/.env.example to .env beside this file, set SCC_ADMIN_PASSWORD,
#      SCC_CORS_ORIGINS=https://chaanbeen.yourdomain.com, SCC_SECRET_KEY (openssl rand -hex 32)
#   2. Base (LAN test):  docker compose up -d --build
#      Tunnel (public):  docker compose -f docker-compose.yml -f docker-compose.tunnel.yml --profile tunnel up -d --build
# No `ports:` on api — Cloudflare Tunnel reaches api:8000 over the compose network.
# No `networks:` — compose creates one automatically; both services share it.

services:
  api:
    build:
      context: .
      dockerfile: webapp/Dockerfile.api
    environment:
      - SCC_CORS_ORIGINS=${SCC_CORS_ORIGINS:-http://localhost:8000}
      - SCC_ADMIN_PASSWORD=${SCC_ADMIN_PASSWORD}
      - SCC_SECRET_KEY=${SCC_SECRET_KEY:-}
      - SCC_API_KEY_PEPPER=${SCC_API_KEY_PEPPER:-}
    volumes:
      - scc-data:/app/webapp/data
    expose:
      - 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  scc-data:
    driver: local
